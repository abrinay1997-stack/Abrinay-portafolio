    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-dark: #000000;
        --accent-teal: #081a1a;
        --accent-orange: #cc4e00;
        --nav-height: 100px;
      }
      html {
        scroll-behavior: smooth;
      }
      /* CRÍTICO: Evita que la navbar tape los títulos al navegar */
      section[id], footer[id] {
        scroll-margin-top: var(--nav-height);
      }
      body {
        background-color: var(--bg-dark);
        color: #888;
        font-family: 'Space Mono', monospace;
        letter-spacing: 0.1em;
        cursor: crosshair;
        overflow-x: hidden;
      }
      .font-cinematic {
        font-family: 'Syncopate', sans-serif;
        letter-spacing: 0.4em;
      }

      /* Escala Tipográfica - Fase 3 */
      .text-display { font-size: clamp(2.5rem, 8vw, 5rem); line-height: 1.1; letter-spacing: 0.1em; }
      .text-h2 { font-size: clamp(1.5rem, 5vw, 3rem); line-height: 1.2; letter-spacing: 0.2em; }
      .text-h3 { font-size: clamp(1.25rem, 3vw, 1.75rem); line-height: 1.3; letter-spacing: 0.15em; }
      .text-body { font-size: 1rem; line-height: 1.6; letter-spacing: 0.05em; }
      .text-micro { font-size: 0.75rem; line-height: 1.4; letter-spacing: 0.2em; }

      /* Accesibilidad - Fase 4 */
      :focus-visible {
        outline: 2px solid var(--accent-orange);
        outline-offset: 4px;
        transition: outline-offset 0.2s ease;
      }

      /* Movimiento Reducido - Fase 5 */
      @media (prefers-reduced-motion: reduce) {
        html { scroll-behavior: auto !important; }
        *, ::before, ::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
        .glitch-text::before { display: none; }
      }

      body::before {
        content: "";
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background-image: url("https://upload.wikimedia.org/wikipedia/commons/7/76/1k_Static_Noise_Grain.png");
        opacity: 0.03;
        pointer-events: none;
        z-index: 9999;
      }
      .glass {
        background: rgba(255, 255, 255, 0.02);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      .glitch-text {
        position: relative;
        color: #fff;
      }
      .glitch-text::before {
        content: attr(data-text);
        position: absolute;
        left: -2px;
        text-shadow: 2px 0 var(--accent-orange);
        clip: rect(44px, 450px, 56px, 0);
        animation: glitch-anim 5s infinite linear alternate-reverse;
      }
      @keyframes glitch-anim {
        0% { clip: rect(31px, 9999px, 94px, 0); }
        20% { clip: rect(62px, 9999px, 42px, 0); }
        100% { clip: rect(89px, 9999px, 98px, 0); }
      }
      
      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-track { background: #000; }
      ::-webkit-scrollbar-thumb { background: #cc4e00; }
      
      .audio-bars {
        display: flex;
        align-items: flex-end;
        gap: 2px;
      }
      .bar {
        width: 2px;
        background: var(--accent-orange);
        animation: sound-wave 1s infinite ease-in-out;
      }
      @keyframes sound-wave {
        0%, 100% { height: 2px; }
        50% { height: 12px; }
      }
    </style>
</head>
<body>
    <div id="root"></div>

</body>
