<html lang="es">
<head>

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Brian Joel Carvajal Mahecha",
      "alternateName": "Abrinay",

      "jobTitle": "Composer & Sound Designer",
      "sameAs": [

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-dark: #050505;
        --accent-teal: #081a1a;
        --accent-orange: #cc4e00;
        --nav-height: 100px;
        --text-primary: #ffffff;
        --text-muted: rgba(255, 255, 255, 0.4);
        --mouse-x: 50%;
        --mouse-y: 50%;
      }
      html {
        scroll-behavior: smooth;
      }
      /* CRÍTICO: Evita que la navbar tape los títulos al navegar */
      section[id], footer[id] {
        scroll-margin-top: var(--nav-height);
      }
      body {
        background-color: var(--bg-dark);
        color: var(--text-primary);
        font-family: 'Cinzel', serif;
        cursor: crosshair;
        overflow-x: hidden;
      }
      .font-cinematic {
        font-family: 'Cinzel', serif;
        letter-spacing: 0.4em;
      }

      /* Escala Tipográfica - Fase 3 */
      .text-display { font-family: 'Cinzel', serif; font-size: clamp(2.5rem, 8vw, 5rem); line-height: 1.1; letter-spacing: 0.1em; }
      .text-h2 { font-family: 'Cinzel', serif; font-size: clamp(1.5rem, 5vw, 3rem); line-height: 1.2; letter-spacing: 0.2em; }
      .text-h3 { font-family: 'Cinzel', serif; font-size: clamp(1.25rem, 3vw, 1.75rem); line-height: 1.3; letter-spacing: 0.15em; }
      .text-body { font-family: 'Space Mono', monospace; font-size: 0.9rem; line-height: 1.6; letter-spacing: 0.05em; }
      .text-micro { font-family: 'Space Mono', monospace; font-size: 0.75rem; line-height: 1.4; letter-spacing: 0.2em; }

      /* Accesibilidad - Fase 4 */
      :focus-visible {
        outline: 2px solid var(--accent-orange);
        outline-offset: 4px;
        transition: outline-offset 0.2s ease;
      }

      /* Movimiento Reducido - Fase 5 */
      @media (prefers-reduced-motion: reduce) {
        html { scroll-behavior: auto !important; }
        *, ::before, ::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
        .glitch-text::before { display: none; }
      }

      .noise::before {
          content: "";
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          pointer-events: none;
          z-index: 50;
          opacity: 0.08;
          background-image: url("https://grainy-gradients.vercel.app/noise.svg");
          animation: noise-flicker 0.2s infinite steps(4);
      }

      @keyframes noise-flicker {
        0% { transform: translate(0,0); }
        25% { transform: translate(-1%, -1%); }
        50% { transform: translate(1%, 1%); }
        75% { transform: translate(-1%, 1%); }
        100% { transform: translate(1%, -1%); }
      }

      .vignette {
          position: fixed;
          inset: 0;
          background:
            radial-gradient(circle at var(--mouse-x) var(--mouse-y), transparent 0%, rgba(0,0,0,0.8) 80%),
            radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.4) 100%);
          pointer-events: none;
          z-index: 5;
          transition: background 0.15s ease-out;
      }

      .spotlight {
          position: fixed;
          inset: 0;
          background: radial-gradient(600px circle at var(--mouse-x) var(--mouse-y), rgba(204, 78, 0, 0.05), transparent 40%);
          pointer-events: none;
          z-index: 4;
      }

      .brand-reveal {
          font-family: 'Cinzel', serif;
          text-transform: uppercase;
          color: #ffffff;
          filter: drop-shadow(0 0 15px rgba(255,255,255,0.1));
          text-shadow: 0 0 20px rgba(255,255,255,0.2);
          letter-spacing: 0.25em;
          line-height: 1;
          font-weight: 700;
          transition: all 0.8s ease;
      }

      .brand-reveal:hover {
          letter-spacing: 0.35em;
          filter: drop-shadow(0 0 25px rgba(255,255,255,0.15));
          opacity: 0.9;
      }

      .glass-card {
          background: rgba(255, 255, 255, 0.02);
          backdrop-filter: blur(8px);
          border: 1px solid rgba(255, 255, 255, 0.05);
          transition: all 0.3s ease;
      }

      .glass-card:hover {
          background: #0c0c0c;
          border-color: rgba(255, 255, 255, 0.1);
      }

      .glass {
        background: rgba(255, 255, 255, 0.02);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      .glitch-text {
        position: relative;
        color: #fff;
      }
      .glitch-text::before {
        content: attr(data-text);
        position: absolute;
        left: -2px;
        text-shadow: 2px 0 var(--accent-orange);
        clip: rect(44px, 450px, 56px, 0);
        animation: glitch-anim 5s infinite linear alternate-reverse;
      }
      @keyframes glitch-anim {
        0% { clip: rect(31px, 9999px, 94px, 0); }
        20% { clip: rect(62px, 9999px, 42px, 0); }
        100% { clip: rect(89px, 9999px, 98px, 0); }
      }
      
      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-track { background: #000; }
      ::-webkit-scrollbar-thumb { background: #cc4e00; }
      
      .audio-bars {
        display: flex;
        align-items: flex-end;
        gap: 2px;
      }
      .bar {
        width: 2px;
        background: var(--accent-orange);
        animation: sound-wave 1s infinite ease-in-out;
      }
      @keyframes sound-wave {
        0%, 100% { height: 2px; }
        50% { height: 12px; }
      }

      /* Scroll Reveal */
      .reveal {
        opacity: 0;
        transform: translateY(30px);
        filter: blur(10px);
        transition: all 1.2s cubic-bezier(0.22, 1, 0.36, 1);
        will-change: transform, opacity, filter;
      }
      .reveal-active {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
      }

      @keyframes char-reveal {
        from {
          opacity: 0;
          transform: translateY(10px);
          filter: blur(5px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
          filter: blur(0);
        }
      }
      .char-span {
        display: inline-block;
        opacity: 0;
        animation: char-reveal 1s forwards;
      }

      .page-fade-enter {
        opacity: 0;
        transform: scale(0.98);
        filter: blur(10px);
      }
      .page-fade-active {
        opacity: 1;
        transform: scale(1);
        filter: blur(0);
        transition: all 0.8s cubic-bezier(0.22, 1, 0.36, 1);
      }
    </style>
</head>
<body class="noise">
    <div class="spotlight"></div>
    <div class="vignette"></div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
      document.addEventListener('mousemove', (e) => {
        const x = (e.clientX / window.innerWidth) * 100;
        const y = (e.clientY / window.innerHeight) * 100;
        document.documentElement.style.setProperty('--mouse-x', x + '%');
        document.documentElement.style.setProperty('--mouse-y', y + '%');
      });
    </script>
</body>
</html>
