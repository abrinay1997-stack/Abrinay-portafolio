
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABRINAY | VOID</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-dark: #000000;
        --accent-teal: #081a1a;
        --accent-orange: #cc4e00;
        --nav-height: 100px;
      }
      html {
        scroll-behavior: smooth;
      }
      /* CRÍTICO: Evita que la navbar tape los títulos al navegar */
      section[id], footer[id] {
        scroll-margin-top: var(--nav-height);
      }
      body {
        background-color: var(--bg-dark);
        color: #888;
        font-family: 'Space Mono', monospace;
        letter-spacing: 0.1em;
        cursor: crosshair;
        overflow-x: hidden;
      }
      .font-cinematic {
        font-family: 'Syncopate', sans-serif;
        letter-spacing: 0.4em;
      }
      body::before {
        content: "";
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background-image: url("https://upload.wikimedia.org/wikipedia/commons/7/76/1k_Static_Noise_Grain.png");
        opacity: 0.03;
        pointer-events: none;
        z-index: 9999;
      }
      .glass {
        background: rgba(255, 255, 255, 0.02);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      .glitch-text {
        position: relative;
        color: #fff;
      }
      .glitch-text::before {
        content: attr(data-text);
        position: absolute;
        left: -2px;
        text-shadow: 2px 0 var(--accent-orange);
        clip: rect(44px, 450px, 56px, 0);
        animation: glitch-anim 5s infinite linear alternate-reverse;
      }
      @keyframes glitch-anim {
        0% { clip: rect(31px, 9999px, 94px, 0); }
        20% { clip: rect(62px, 9999px, 42px, 0); }
        100% { clip: rect(89px, 9999px, 98px, 0); }
      }
      
      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-track { background: #000; }
      ::-webkit-scrollbar-thumb { background: #cc4e00; }
      
      .audio-bars {
        display: flex;
        align-items: flex-end;
        gap: 2px;
      }
      .bar {
        width: 2px;
        background: var(--accent-orange);
        animation: sound-wave 1s infinite ease-in-out;
      }
      @keyframes sound-wave {
        0%, 100% { height: 2px; }
        50% { height: 12px; }
      }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
</body>
</html>
